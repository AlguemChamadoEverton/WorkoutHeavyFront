<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Heavy - Workout</title>
    <link rel="stylesheet" href="workout.css">
    <link rel="stylesheet" href="/shared/shared.css">
</head>
<body>
    <template id="comment_overlay">
        <div class="overlay">
            <div id="comment_box_overlay">
            </div>
            <div id="comment_box_background">
            </div>
        </div>
    </template>
    <template id="close_scroll">
        <svg id="x_button" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" tint=" #83898F" type="cross" style="width: 24px; height: 24px; position: absolute; cursor: pointer; right: 0"><path d="M18 6L12 12M12 12L6 18M12 12L6 6M12 12L18 18" stroke=" #83898F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </template>
    <template id="tpl_comment">
        <div class="comments">
            <img class="log_profile_pic" id="comment_profile_pic" src="../shared/guest.svg">
            <div style="padding-left: 15px">
                <b class="comment_username" id="comment_user">israelly</b>
                <span style="color: gray; padding-left: 2px; padding-right: 2px">·</span>
                <span class="time_ago">A few seconds ago</span><br>
                <span class="comment_username" id="comment_text">Não sei o que faço, a minha vida é uma luta sem fimaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</span>
            </div>
        </div>
    </template>
    <template id="session">
        <div class="session">
            <div class="exercise">
                <img class="exercise_img" src="https://raw.githubusercontent.com/everkinetic/data/master/src/images-web/bench-press-2.png">
                <p class="exercise_text exercise_name"> 4 Sets Bench Press (Barbell)</p>
            </div>
            <div class="info_labels">
                <span class="sets_label">SETS</span>
                <span class="weight_reps_label">WEIGHT & REPS</span>
            </div>
        </div>
    </template>
    <template id="set_info">
        <div class="set_info">
            <span class="set_status normal_set">1</span>
            <span class="weight_reps" style="color: white">90kg x 6 reps</span>
            <div class="sets_records"></div>
        </div>
    </template>
    <template id="best"><span class="best">🏅 Best Volume</span></template>
    <template id="see_more"><a class="link"><span id="exercises_more">See 3 more exercises</span></a></template>
    <div class="page_main">
        <template class="workout_template">
            <div class="home">
            <div class="workout_log">
                <div id="workout_log_content">
                    <div id="workout_user">
                        <a href=""><img id="log_profile_pic" src="../shared/guest.svg"></a>
                        <div id="workout_profile_text">
                            <a id="workout_log_username" href="">everton.dev</a><br>
                            <span id="workout_data">Oct 27, 2026, 7:12 AM</span>
                        </div>
                    </div>
                    <div id="workout_overview">
                        <a id="workout_routinename">Push Day - Peito e Tríceps</a>
                        <div id="log">
                            <div class="log_blocks" id="workout_duration">
                                <span class="log_titles">Duration</span>
                                <span class="log_values" id="duration_value">1h 12m</span>
                            </div>
                            <div class="log_blocks" id="workout_volume">
                                <span class="log_titles">Volume</span>
                                <span class="log_values" id="volume_value">12,480 kg</span>
                            </div>
                            <div class="log_blocks" id="workout_records">
                                <span class="log_titles">Records</span>
                                <span class="log_values" id="records_value">🏅4</span>
                            </div>
                        </div>
                    </div>
                    <div class="break_line"></div>
                    <div class="break_line overlay_only"></div>
                    <div id="social">
                        <div id="reactions">
                            <a style="cursor: pointer"><div class="emote">
                                <svg width="24" height="24" stroke="currentColor" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" tint=" #FFFFFF" type="like" style="width: 24px; height: 24px;"><path d="M7 10H4C3.44772 10 3 10.4477 3 11V21C3 21.5523 3.44772 22 4 22H8V11C8 10.4477 7.55228 10 7 10Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14.8974 5.44617C14.8974 7.16671 14 7.96666 14 9H20H20.2741C20.8189 9 21.3037 9.22214 21.6236 9.61088C22.2834 10.4237 22.0535 11.7414 21.1088 12.5542C21.7686 13.367 21.5386 14.6847 20.594 15.4975C21.2538 16.3103 21.0238 17.628 20.0792 18.4408C20.739 19.2536 20.509 20.5763 19.5644 21.3891C19.1096 21.7829 18.5448 22 18 22H8V13.7231C8 8.20514 11.4513 6.13846 12.1385 2C14.2102 2 14.8974 3.72563 14.8974 5.44617Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                <span id="like">0</span>
                            </div></a>
                            <a style="cursor: pointer"><div class="emote">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" tint=" #FFFFFF" type="comment" style="width: 24px; height: 24px;"><path d="M22 12C22 16.9706 17.9097 21 12.8642 21C11.7068 21 10.5998 20.788 9.58079 20.4013C9.39449 20.3306 9.30134 20.2952 9.22727 20.2784C9.15441 20.2619 9.10167 20.2549 9.02695 20.2521C8.95099 20.2493 8.86765 20.2577 8.70097 20.2747L3.19687 20.8352C2.6721 20.8887 2.40972 20.9154 2.25494 20.8224C2.12013 20.7414 2.02831 20.606 2.00387 20.4523C1.97581 20.2759 2.10119 20.0473 2.35196 19.59L4.10997 16.3844C4.25475 16.1204 4.32714 15.9884 4.35992 15.8615C4.39231 15.7361 4.40013 15.6457 4.38978 15.5168C4.37929 15.3862 4.32114 15.2163 4.20485 14.8764C3.89582 13.9732 3.72831 13.0059 3.72831 12C3.72831 7.02944 7.81857 3 12.8642 3C17.9097 3 22 7.02944 22 12Z" stroke=" #FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                <span id="comments_count" class="exercise_text">0</span>
                            </div></a>
                            <a style="cursor: pointer"><div class="emote">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" tint=" #FFFFFF" type="share" style="width: 24px; height: 24px;"><path d="M3 15.5V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V15.5" stroke=" #FFFFFF" stroke-width="1.5" stroke-linecap="round"></path><path d="M11.2539 16C11.2539 16.4142 11.5897 16.75 12.0039 16.75C12.4181 16.75 12.7539 16.4142 12.7539 16H11.2539ZM11.2539 3.5V16H12.7539V3.5H11.2539Z" fill=" #FFFFFF"></path><path d="M7.75 7.24219L11.9926 2.99955L16.2353 7.24219" stroke=" #FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </div></a>
                        </div>
                        <div id="comment">

                        </div>
                        <div id="make_comment">
                            <img class="user_img" src="../shared/guest.svg">
                            <div id="comment_box">
                                <input id="comentario" class="search_users" placeholder="Write a comment">
                            </div>
                            <p class="post_comment">Post</p>
                        </div>
                    </div>
                    <div id="exercises_summary">
                    </div>
                </div>
            </div>
            <template>
                <div class="profile_box">
                    <div class="profile">
                        <img class="user_img_big" src="../shared/guest.svg">
                        <div class="profile_text">
                            <span class="username">everton.dev</span>
                            <div class="profile_info">
                                <div class="profile_labels">
                                    <span>Workouts <br><span class="profile_numbers">127</span></span>
                                    <span>Following <br><span class="profile_numbers">183</span></span>
                                    <span>Followers<br><span class="profile_numbers">248</span></span>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        </template>
        <template class="not_found_template">
            <div class="home">
                <div class="workout_log not_found">
                    <img class="not_found_img" src="../shared/not_found.svg" alt="not_found_img">
                    <span class="not_found_title">Workout not found</span>
                    <span class="not_found_text">This workout might not exist anymore. Make sure you have the right link.</span>
                </div>
                <div class="profile_box not_found_profile">
                    <div class="profile">
                        <img class="user_img_big" src="../shared/guest.svg">
                        <div class="profile_text">
                            <span class="username">-</span>
                            <div class="profile_info">
                                <div class="profile_labels">
                                    <span>Workouts <br><span class="profile_numbers">-</span></span>
                                    <span>Following <br><span class="profile_numbers">-</span></span>
                                    <span>Followers<br><span class="profile_numbers">-</span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="follow_button">Follow</button>
                </div>
            </div>
        </template>
    </div>
<script type="module" src="workout.js"></script>
</body>
</html>
