<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Heavy - Routines</title>
    <link rel="stylesheet" href="routines.css">
    <link rel="stylesheet" href="/shared/shared.css">
</head>
<body>
<script src="../shared/menu_html.js"></script>
    <template id="folder">
        <div class="folder">
            <div class="folder_header">
                <svg class="folder_arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#83898F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9L12 15L18 9"></path></svg>
                <span class="folder_name">Full Body ABC 5/3/1 (3)</span>
                <svg class="options" width="24" height="24" viewBox="0 0 24 24" fill="white"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
            </div>
            <div class="folder_routines">
            </div>
        </div>
    </template>
    <template id="routine">
        <div class="routine">
            <div class="routine_header">
                <b class="routine_name">Full Body A</b>
                <svg class="options" width="24" height="24" viewBox="0 0 24 24" fill="white"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
            </div>
            <span class="routine_exercises">Squat (Barbell), Pull Up (Weighted), Chest Dip (Weighted), Overhead Press (Barbell)</span>
        </div>
    </template>
    <template id="break_line"><div class="break_line"></div></template>
    <div class="page_main">
        <div class="routines_page">
            <div class="routines_column">
                <b class="title">Routines</b>
            </div>
            <div class="routines_panel">
                <a class="panel_option" href="">
                    <div class="panel_icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3H15V4"></path><path d="M9 10H15M9 14H15"></path></svg>
                    </div>
                    <span class="panel_text">New Routine</span>
                    <svg class="panel_arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#83898F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L15 12L9 18"></path></svg>
                </a>
                <div class="break_line"></div>
                <a class="panel_option" href="">
                    <div class="panel_icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7C3 5.9 3.9 5 5 5H9L11 7H19C20.1 7 21 7.9 21 9V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V7Z"></path><path d="M12 11V16M9.5 13.5H14.5"></path></svg>
                    </div>
                    <span class="panel_text">New Folder</span>
                    <svg class="panel_arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#83898F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L15 12L9 18"></path></svg>
                </a>
            </div>
        </div>
    </div>
<script type="module" src="routines.js"></script>
</body>
</html>
